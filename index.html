<title>Hemma · Städtavlan</title>
<style>
:root{--bg:#f4f4ef;--paper:#fffefb;--ink:#22312b;--muted:#68796d;--line:#e4e8df;--green:#2d674f;--greenSoft:#e4f1e8;--orange:#b26d2b;--orangeSoft:#fff1dd;--shadow:0 8px 35px rgba(45,67,54,.06)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus,input:focus,select:focus,textarea:focus{outline:3px solid rgba(65,124,86,.24);outline-offset:2px}button[disabled]{opacity:.45;cursor:default}
#app{display:-webkit-flex;display:flex;min-height:100vh;min-height:100dvh}.sidebar{width:210px;min-width:210px;background:#eaf0e7;border-right:1px solid #dce4d8;padding:25px 16px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}.brand{padding:0 9px 20px;border-bottom:1px solid #d6dfd3;margin-bottom:16px}.brand-mark{width:40px;height:40px;background:#d5e8d8;border-radius:12px;text-align:center;line-height:40px;font-size:23px;margin-bottom:10px}.brand h1{font-size:25px;line-height:1.05;letter-spacing:-.7px;margin:0}.brand small{font-size:12px;color:#63756b;display:block;margin-top:6px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.navbtn{width:100%;display:block;text-align:left;color:#456052;border:0;background:transparent;border-radius:11px;padding:13px 12px;margin-bottom:7px;font-size:15px;font-weight:650}.navbtn.active{background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(34,78,58,.14)}.navbtn span{display:inline-block;width:29px;font-size:17px}.wake{width:auto;min-width:215px;border-radius:12px;border:1px solid #cbd8cc;background:var(--paper);color:var(--green);font-weight:750;padding:13px 10px}.wake.on{background:var(--green);color:#fff}.sidehint{font-size:12px;line-height:1.5;color:var(--muted);margin:10px 0 0}
.main{min-width:0;-webkit-flex:1;flex:1;padding:29px 34px 34px;max-width:1600px;margin:0 auto}.top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:25px;min-height:64px}.kicker{text-transform:uppercase;letter-spacing:1.2px;color:#6c8772;font-weight:750;font-size:11px;margin:0 0 5px}.top h2{margin:0;font-size:29px;line-height:1.15;letter-spacing:-.7px}.top-tools{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}.clock{padding:0 16px 0 8px;font-size:24px;font-weight:750;color:#456957;font-variant-numeric:tabular-nums}.arrow{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-size:20px;margin-left:6px}.top-today{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;font-weight:650;margin-left:7px}.dateinfo{color:var(--muted);font-size:14px;margin:6px 0 0}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:13px;margin-bottom:20px}.stat{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:15px;padding:18px 20px;min-height:111px}.stat label{display:block;color:#7c8a80;font-size:12px;font-weight:700;margin-bottom:10px}.stat strong{font-size:32px;font-weight:750;letter-spacing:-1px}.stat span{font-size:12px;color:#738177;margin-left:7px}
.panel{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:21px 23px;margin-bottom:17px}.panelhead{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:17px}.panel h3{margin:0;font-size:19px;letter-spacing:-.3px}.muted{color:var(--muted)}.small{font-size:12px}.caption{font-size:13px;color:var(--muted);line-height:1.5}.pill{border-radius:15px;background:var(--greenSoft);color:var(--green);font-size:11px;font-weight:800;padding:6px 10px}.pill.warn{background:var(--orangeSoft);color:var(--orange)}
.taskrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;border-top:1px solid #eef0eb;min-height:66px;padding:9px 0}.taskrow:first-child{border-top:0}.check{width:32px;height:32px;min-width:32px;border-radius:10px;border:2px solid #c8d5cb;background:#fff;margin-right:15px;color:#fff;font-size:19px;font-weight:700;line-height:25px;text-align:center}.check.done{border-color:var(--green);background:var(--green)}.taskname{font-weight:700;font-size:15px;line-height:1.35}.taskname.done{text-decoration:line-through;color:#89968c}.taskmeta{font-size:12px;color:#829085;margin-top:5px}.taskend{margin-left:auto;text-align:right;padding-left:10px}.minibtn{border:1px solid var(--line);border-radius:10px;background:#fff;color:#536a59;padding:8px 11px;font-size:12px;font-weight:750}.primary{border:0;border-radius:11px;background:var(--green);color:#fff;padding:12px 17px;font-weight:750}.secondary{border:1px solid #d3ded3;border-radius:11px;background:#fff;color:#315d46;padding:11px 15px;font-weight:700}.danger{color:#a64540}.empty{padding:27px 10px;text-align:center;color:#75877b;line-height:1.5}.progress{height:9px;border-radius:15px;background:#e9eee8;overflow:hidden;margin-top:15px}.progress div{background:var(--green);height:100%;border-radius:15px;transition:width .18s}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-gap:9px}.daybox{padding:12px 8px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:192px;color:var(--ink);overflow:hidden}.daybox.today{background:#eff6ef;border-color:#a8cbb0}.daybox.selected{box-shadow:0 0 0 2px var(--green)}.daybox .dow{font-size:11px;font-weight:750;color:#788b7e;text-transform:uppercase}.daybox .daynum{font-size:24px;font-weight:750;margin-top:7px;margin-bottom:7px}.daybox .summary{font-size:12px;color:var(--green);font-weight:700;margin-bottom:9px}.daybox .teaser{color:#6f7e73;font-size:11px;margin-top:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.daybox .teaser.done{text-decoration:line-through;color:#9aaba0}.daybox .note{font-size:11px;color:#89998e;margin-top:8px}
.monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-gap:7px}.monthweekday{text-align:center;color:#839185;font-size:12px;font-weight:800;padding:7px}.monthday{border:1px solid var(--line);border-radius:11px;background:#fff;min-height:102px;text-align:left;padding:10px;vertical-align:top}.monthday.today{background:#eff6ef;border-color:#a8cbb0}.monthday.empty{border:0;background:transparent}.monthnum{font-size:16px;font-weight:750}.monthstat{margin-top:12px;font-size:11px;color:#748478}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px}.dot.miss{background:#d79b54}
.listcontrols{display:-webkit-flex;display:flex;margin-bottom:16px}.listcontrols input{-webkit-flex:1;flex:1;min-width:0;margin-right:9px}.textinput,select,textarea{border:1px solid #dbe3da;border-radius:10px;background:white;padding:12px;color:var(--ink);width:100%;font-size:15px}textarea{min-height:115px;resize:vertical}label.field{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.fieldblock{margin-bottom:15px}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;grid-gap:12px}.daychoices{display:grid;grid-template-columns:repeat(7,1fr);grid-gap:5px;margin-top:6px}.daychoices label{padding:11px 4px;border:1px solid #dbe4db;background:#f7faf6;border-radius:9px;text-align:center;font-weight:700;font-size:12px}.daychoices input{display:block;margin:0 auto 6px;accent-color:var(--green)}.formactions{display:-webkit-flex;display:flex;-webkit-justify-content:flex-end;justify-content:flex-end;margin-top:20px}.formactions button{margin-left:8px}
.manageitem{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;border-top:1px solid #eef0eb;padding:12px 0}.manageitem:first-child{border-top:0}.manageitem .maintext{-webkit-flex:1;flex:1;padding-right:12px;min-width:0}.manageitem .minibtn{margin-left:8px}.notice{background:#fff8ea;border:1px solid #f1ddba;color:#80632f;padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:16px}.successnote{background:#edf5ed;border:1px solid #cee3ce;color:#3b674b;padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:16px}.helper{border-left:3px solid #bad3be;padding:10px 15px;background:#f3f7f1;color:#65776a;font-size:13px;line-height:1.5}.footnote{font-size:12px;color:#8a958b;margin-top:22px;line-height:1.5}
.modalshade{display:none;position:fixed;z-index:99;left:0;top:0;right:0;bottom:0;overflow:auto;background:rgba(29,45,33,.42);padding:22px}.modalshade.visible{display:block}.modal{max-width:570px;margin:20px auto;background:var(--paper);border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(20,40,22,.23)}.modal h3{font-size:23px;margin:0 0 17px}.underbar{margin-top:9px}
@media(max-width:860px){.sidebar{width:174px;min-width:174px;padding:20px 11px}.main{padding:23px 20px}.stat{padding:15px 12px}.daybox{padding:10px 6px;min-height:180px}.daybox .teaser{font-size:10px}.top h2{font-size:25px}.clock{font-size:20px}}
@media(max-width:650px){#app{display:block}.sidebar{width:100%;min-width:0;display:block;padding:12px;border-bottom:1px solid var(--line)}.brand{display:none}.nav{display:-webkit-flex;display:flex;overflow-x:auto;white-space:nowrap}.navbtn{width:auto;padding:9px 11px;margin:0 4px 0 0;flex:0 0 auto;font-size:13px}.navbtn span{width:auto;margin-right:4px}.wake{padding:10px 13px;font-size:13px}.main{padding:17px 12px}.top{margin-bottom:18px}.top h2{font-size:22px}.clock{font-size:17px;padding-right:4px}.arrow{width:33px;height:36px}.top-today{padding:9px}.statgrid{grid-gap:7px}.stat{padding:11px 9px;min-height:90px}.stat label{font-size:11px}.stat strong{font-size:24px}.stat span{display:block;margin:0}.panel{padding:14px}.weekgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.daybox{min-height:126px}.monthday{min-height:72px;padding:4px}.monthstat{font-size:9px;margin-top:6px}.daychoices label{padding:9px 1px;font-size:10px}.fieldgrid{grid-template-columns:1fr}.taskrow{min-height:58px}.taskname{font-size:14px}}

/* Knappen i dagvyn fungerar också i äldre Safari med flexbox. */
.day-panel-head{-webkit-flex-wrap:wrap;flex-wrap:wrap}
.day-panel-actions{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.day-panel-actions .primary{margin-right:10px;min-height:44px;white-space:nowrap}
.day-panel-actions .pill{white-space:nowrap}
@media(max-width:650px){.day-panel-actions{width:100%;margin-top:12px}.day-panel-actions .primary{-webkit-flex:1;flex:1}}
/* Tema: inga externa typsnitt, bibliotek eller CSS-funktioner som kräver nyare Safari. */
.themecontrols{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:12px 0 9px}
.themechoice{background:var(--paper);border:2px solid var(--line);color:var(--ink);border-radius:12px;min-height:49px;padding:11px 17px;font-weight:700;margin-right:9px;margin-bottom:9px}
.themechoice[aria-pressed="true"]{border-color:var(--green);background:var(--greenSoft);color:var(--green)}
.themehint{font-size:13px;color:var(--muted);line-height:1.55;margin:10px 0}
.theme-light-note{display:inline-block;background:var(--greenSoft);border-radius:8px;padding:5px 9px;font-weight:750;color:var(--green)}
/* Mörkt läge. Vi skriver över fasta ljusa färger i den ursprungliga designen. */
html.theme-dark{--bg:#121a17;--paper:#1e2a24;--ink:#eaf1eb;--muted:#adbdaf;--line:#3b5143;--green:#93d6aa;--greenSoft:#2d4939;--orange:#f3bd7a;--orangeSoft:#473823;--shadow:0 8px 35px rgba(0,0,0,.19)}
.theme-dark .sidebar{background:#18251f;border-color:#314537}
.theme-dark .brand{border-color:#314537}
.theme-dark .brand-mark{background:#304938}
.theme-dark .brand small,.theme-dark .navbtn,.theme-dark .kicker,.theme-dark .clock{color:#b6d1bc}
.theme-dark .navbtn.active,.theme-dark .primary,.theme-dark .wake.on,.theme-dark .check.done{color:#12261a}
.theme-dark .navbtn.active{box-shadow:none}
.theme-dark .stat label,.theme-dark .stat span,.theme-dark .dateinfo,.theme-dark .taskmeta,.theme-dark .caption,.theme-dark .footnote,.theme-dark .taskname.done{color:#afc1b3}
.theme-dark .taskrow,.theme-dark .manageitem{border-color:#324438}
.theme-dark .check{background:#293a2f;border-color:#768e7b;color:transparent}
.theme-dark .check.done{background:var(--green);border-color:var(--green);color:#12261a}
.theme-dark .minibtn,.theme-dark .secondary,.theme-dark .arrow,.theme-dark .top-today,.theme-dark .daybox,.theme-dark .monthday,.theme-dark .wake{background:#25362b;border-color:#47604e;color:#e1f0e2}
.theme-dark .wake.on{background:var(--green);color:#12261a}
.theme-dark .danger{color:#ffb1aa}
.theme-dark .empty{color:#b4c8b8}
.theme-dark .progress{background:#334538}
.theme-dark .daybox.today,.theme-dark .monthday.today{background:#2c4738;border-color:#5b9671}
.theme-dark .daybox .dow,.theme-dark .daybox .teaser,.theme-dark .daybox .note,.theme-dark .monthweekday,.theme-dark .monthstat{color:#c0d3c2}
.theme-dark .daybox .teaser.done{color:#9aab9d}
.theme-dark .textinput,.theme-dark select,.theme-dark textarea{background:#17241d;border-color:#45604c;color:#edf5ed}
.theme-dark .textinput::placeholder,.theme-dark textarea::placeholder{color:#99ad9c}
.theme-dark .daychoices label{background:#25382b;border-color:#45604c;color:#eaf1eb}
.theme-dark .notice{background:#493923;border-color:#70522b;color:#f1d49a}
.theme-dark .successnote{background:#284b38;border-color:#467853;color:#d7efdc}
.theme-dark .helper{background:#24392d;border-color:#608c6a;color:#c3d7c7}
.theme-dark .themechoice{background:#25362b;border-color:#506956;color:#eaf1eb}
.theme-dark .themechoice[aria-pressed="true"]{background:var(--greenSoft);border-color:var(--green);color:var(--green)}
.theme-dark .modalshade{background:rgba(0,0,0,.7)}
@media(max-width:650px){.themecontrols{display:block}.themechoice{width:100%;margin-bottom:8px}.wake{width:100%}}
</style>

<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">⌂</div><h1>Hemma.</h1><small>Vår städtavla</small></div>
    <nav class="nav" id="navigation" aria-label="Vyer">
      <button class="navbtn active" data-nav="day"><span>☀</span> Idag</button>
      <button class="navbtn" data-nav="week"><span>▦</span> Vecka</button>
      <button class="navbtn" data-nav="month"><span>▤</span> Månad</button>
      <button class="navbtn" data-nav="shopping"><span>▣</span> Inköp</button>
      <button class="navbtn" data-nav="tasks"><span>☑</span> Uppgifter</button>
      <button class="navbtn" data-nav="settings"><span>⚙</span> Inställningar</button>
    </nav>
  </aside>
  <main class="main">
    <header class="top"><div><p class="kicker" id="kicker">HEMMA HOS OSS</p><h2 id="pageTitle">Idag</h2><p class="dateinfo" id="pageSub"></p></div><div class="top-tools"><span class="clock" id="clock">--:--</span><button class="top-today" id="goToday" type="button">Idag</button><button class="arrow" id="prevDate" type="button" aria-label="Föregående">‹</button><button class="arrow" id="nextDate" type="button" aria-label="Nästa">›</button></div></header>
    <div id="warning"></div><div id="content"></div>
    <p class="footnote">Allt sparas lokalt i den här webbläsaren. Gör en säkerhetskopia under Inställningar.</p>
  </main>
</div>
<div class="modalshade" id="taskModal" role="dialog" aria-modal="true" aria-label="Redigera uppgift">
  <div class="modal"><h3 id="modalTitle">Ny uppgift</h3>
    <form id="taskForm">
      <div class="fieldblock"><label class="field" for="taskName">Vad ska göras?</label><input class="textinput" id="taskName" maxlength="100" placeholder="Exempel: Dammsuga vardagsrummet" required></div>
      <div class="fieldgrid">
        <div class="fieldblock"><label class="field" for="taskRoom">Rum eller kategori</label><select id="taskRoom"><option>Kök</option><option>Badrum</option><option>Sovrum</option><option>Vardagsrum</option><option>Hela hemmet</option><option>Tvätt</option><option>Annat</option></select></div>
        <div class="fieldblock"><label class="field" for="taskFrequency">Hur ofta?</label><select id="taskFrequency"><option value="once">En gång (valt datum)</option><option value="daily">Varje dag</option><option value="weekly">Valda veckodagar</option><option value="interval">Var N:e dag</option><option value="monthly">Varje månad</option></select></div>
      </div>
      <div class="fieldblock" id="onceFields" style="display:none"><label class="field" for="taskOnceDate">Vilket datum?</label><input class="textinput" id="taskOnceDate" type="date" required></div>
      <div class="fieldblock" id="weeklyFields" style="display:none"><label class="field">Vilka dagar?</label><div class="daychoices" id="dayChoices"></div></div>
      <div id="intervalFields" class="fieldgrid" style="display:none"><div class="fieldblock"><label class="field" for="taskInterval">Antal dagar</label><input class="textinput" id="taskInterval" type="number" min="1" max="365" value="14"></div><div class="fieldblock"><label class="field" for="taskStart">Första datum</label><input class="textinput" id="taskStart" type="date"></div></div>
      <div class="fieldblock" id="monthlyFields" style="display:none"><label class="field" for="taskMonthDay">Vilken dag i månaden?</label><input class="textinput" id="taskMonthDay" type="number" min="1" max="31" value="1"><p class="caption">Om dagen saknas används månadens sista dag.</p></div>
      <div class="formactions"><button class="secondary" type="button" id="cancelTask">Avbryt</button><button class="primary" type="submit">Spara uppgift</button></div>
    </form>
  </div>
</div>

<script>
(function(){
'use strict';
var KEY='hemma-stadtavla-v1';
var DAY_NAMES=['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];

var state, page='day', selected=midnight(new Date()), editing=null, keepAwake=false, storageError=false, awakeNative=null;
var $=function(id){return document.getElementById(id);};
function midnight(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12,0,0);}
function fmt(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function parseDate(s){if(!/^\d{4}-\d\d-\d\d$/.test(String(s||'')))return midnight(new Date());var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2],12,0,0);}
function advance(d,n){var a=midnight(d);a.setDate(a.getDate()+n);return a;}
function weekStart(d){return advance(d,-((d.getDay()+6)%7));}
function dateNum(d){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);}
function weekday(d){return (d.getDay()+6)%7;}
function sameDay(a,b){return fmt(a)===fmt(b);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function uid(){return 't'+(new Date()).getTime().toString(36)+Math.floor(Math.random()*100000).toString(36);}
function task(t,room,type,days,more){var x={id:uid(),name:t,room:room,type:type,days:days||[],eachN:7,start:fmt(new Date()),monthDay:1};if(more)for(var k in more)x[k]=more[k];return x;}
function defaults(){return {version:1,tasks:[
 task('Torka av köksbänkar','Kök','daily'),task('Plocka undan','Hela hemmet','daily'),task('Diska / töm diskmaskinen','Kök','daily'),
 task('Dammsuga golv','Hela hemmet','weekly',[2,5]),task('Rengöra badrummet','Badrum','weekly',[4]),
 task('Damma av ytor','Hela hemmet','weekly',[3]),task('Byta sängkläder','Sovrum','weekly',[6]),
 task('Rensa gammal mat i kylen','Kök','weekly',[0]),task('Torka köksluckor','Kök','monthly',[],{monthDay:15}),
 task('Rengöra ugn och mikro','Kök','monthly',[],{monthDay:1})
  ],done:{},shopping:[],theme:'light'};}
function load(){try{var raw=localStorage.getItem(KEY);if(raw){var found=JSON.parse(raw);if(found&&Array.isArray(found.tasks)&&found.done&&Array.isArray(found.shopping)){if(['light','dark','auto'].indexOf(found.theme)<0)found.theme='light';return found;}}}catch(e){storageError=true;}return defaults();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageError=false;}catch(e){storageError=true;}showWarning();}
function showWarning(){if(storageError)$('warning').innerHTML='<div class="notice">Safari kunde inte spara data. Öppna tavlan via en vanlig webbplats och kontrollera att privat surfning är avstängd. Säkerhetskopiera dina listor.</div>';else $('warning').innerHTML='';}
function isDue(t,d){if(t.start&&dateNum(d)<dateNum(parseDate(t.start)))return false;var w=weekday(d);if(t.type==='once')return fmt(d)===t.start;if(t.type==='daily')return true;if(t.type==='weekly')return Array.isArray(t.days)&&t.days.indexOf(w)>=0;if(t.type==='interval'){var step=Math.max(1,parseInt(t.eachN,10)||1);var diff=dateNum(d)-dateNum(parseDate(t.start));return diff>=0&&diff%step===0;}if(t.type==='monthly')return d.getDate()===Math.min(Math.max(1,parseInt(t.monthDay,10)||1),new Date(d.getFullYear(),d.getMonth()+1,0).getDate());return false;}
function due(d){return state.tasks.filter(function(t){return isDue(t,d);});}
function done(t,d){return ((state.done[fmt(d)]||[]).indexOf(t.id)>=0);}
function countDone(d){return due(d).filter(function(t){return done(t,d);}).length;}
function mark(tid,d){var key=fmt(d),list=state.done[key]||[];var i=list.indexOf(tid);if(i>=0)list.splice(i,1);else list.push(tid);if(list.length)state.done[key]=list;else delete state.done[key];save();render();}
function dateLong(d){return DAY_NAMES[weekday(d)]+' '+d.getDate()+' '+MONTH_NAMES[d.getMonth()]+' '+d.getFullYear();}
function scheduleLabel(t){if(t.type==='once')return 'En gång · '+(t.start||'');if(t.type==='daily')return 'Varje dag';if(t.type==='weekly'){var ds=(t.days||[]).slice().sort().map(function(n){return DAY_NAMES[n].slice(0,3).toLowerCase();});return ds.join(', ')||'Inga dagar valda';}if(t.type==='interval')return 'Var '+(t.eachN||1)+':e dag från '+(t.start||'');if(t.type==='monthly')return 'Den '+(t.monthDay||1)+':a varje månad';return 'Eget schema';}
function viewHtml(){if(page==='day')return dayHtml();if(page==='week')return weekHtml();if(page==='month')return monthHtml();if(page==='shopping')return shoppingHtml();if(page==='tasks')return tasksHtml();return settingsHtml();}
function render(){var today=midnight(new Date()), titles={day:'Dagens städning',week:'Veckoplanering',month:'Månadsöversikt',shopping:'Inköpslista',tasks:'Alla uppgifter',settings:'Inställningar'};$('pageTitle').textContent=titles[page];$('kicker').textContent='HEMMA HOS OSS';$('pageSub').textContent=page==='day'?dateLong(selected):page==='week'?('Vecka '+isoWeek(selected)+' · '+fmt(weekStart(selected))+' – '+fmt(advance(weekStart(selected),6))):page==='month'?(MONTH_NAMES[selected.getMonth()]+' '+selected.getFullYear()):'Din personliga städtavla';$('goToday').style.display=['day','week','month'].indexOf(page)>=0?'':'none';$('prevDate').style.display=$('goToday').style.display;$('nextDate').style.display=$('goToday').style.display;Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'),function(b){b.className=b.getAttribute('data-nav')===page?'navbtn active':'navbtn';});$('content').innerHTML=viewHtml();applyTheme();updateWakeControls();updateClock();showWarning();}
function isoWeek(date){var d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));var yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-yearStart)/86400000)+1)/7);}
function bar(doneCount,total){return '<div class="progress"><div style="width:'+(total?Math.round(100*doneCount/total):0)+'%"></div></div>';}
function checkRow(t,d,meta){var yes=done(t,d);return '<div class="taskrow"><button class="check '+(yes?'done':'')+'" data-action="toggle" data-id="'+esc(t.id)+'" data-date="'+fmt(d)+'" aria-label="'+(yes?'Avmarkera ':'Klarmarkera ')+esc(t.name)+'">'+(yes?'✓':'')+'</button><div><div class="taskname '+(yes?'done':'')+'">'+esc(t.name)+'</div><div class="taskmeta">'+esc(t.room)+' · '+esc(meta||scheduleLabel(t))+'</div></div><div class="taskend">'+(yes?'<span class="pill">Klart</span>':'<span class="pill warn">Att göra</span>')+'</div></div>';}
function dayHtml(){var list=due(selected),n=countDone(selected),today=midnight(new Date()),past=selected<today,upcoming=selected>today;var output='<div class="statgrid"><div class="stat"><label>UPPGIFTER</label><strong>'+list.length+'</strong><span>schemalagda</span></div><div class="stat"><label>AVKLARADE</label><strong>'+n+'</strong><span>av '+list.length+'</span></div><div class="stat"><label>KVAR</label><strong>'+(list.length-n)+'</strong><span>uppgifter</span></div></div>';
output+='<section class="panel"><div class="panelhead day-panel-head"><h3>'+(past?'Så gick dagen':upcoming?'Planerat den här dagen':'Att göra idag')+'</h3><div class="day-panel-actions"><button class="primary" type="button" data-action="add-day-task" aria-label="Lägg till egen uppgift för '+fmt(selected)+'">+ Egen uppgift</button><span class="pill">'+(list.length?Math.round(100*n/list.length):100)+'% klart</span></div></div>';
if(!list.length)output+='<div class="empty">Inga uppgifter den här dagen. Tryck på Egen uppgift ovan.</div>';
list.forEach(function(t){output+=checkRow(t,selected);});output+=bar(n,list.length)+'</section>';
if(sameDay(selected,today)){var missed=[];for(var i=1;i<=7;i++){var d=advance(today,-i);due(d).forEach(function(t){if(!done(t,d))missed.push({t:t,d:d});});}if(missed.length){output+='<section class="panel"><div class="panelhead"><h3>Missat senaste 7 dagarna</h3><span class="pill warn">'+missed.length+' st</span></div><p class="caption">Gamla uppgifter ligger kvar i historiken. Du kan bocka av dem i efterhand.</p>';missed.slice(0,8).forEach(function(x){output+=checkRow(x.t,x.d,x.d.getDate()+' '+MONTH_NAMES[x.d.getMonth()]);});if(missed.length>8)output+='<p class="caption">Ytterligare '+(missed.length-8)+' missade uppgifter finns i dag- eller veckovyn.</p>';output+='</section>';}}
output+='<div class="helper">Ändra datum med pilarna. Allt sparas per kalenderdag, så gamla avbockningar finns kvar.</div>';return output;}
function weekHtml(){var start=weekStart(selected),total=0,complete=0,str='<section class="panel"><div class="panelhead"><h3>Veckans dagar</h3><span class="pill">Tryck på en dag</span></div><div class="weekgrid">';for(var i=0;i<7;i++){var d=advance(start,i),items=due(d),n=countDone(d);total+=items.length;complete+=n;str+='<button class="daybox '+(sameDay(d,new Date())?'today ':'')+'" data-action="open-date" data-date="'+fmt(d)+'"><div class="dow">'+DAY_NAMES[i]+'</div><div class="daynum">'+d.getDate()+'</div><div class="summary">'+n+' / '+items.length+' klara</div>';items.slice(0,3).forEach(function(t){str+='<div class="teaser '+(done(t,d)?'done':'')+'">'+(done(t,d)?'✓ ':'○ ')+esc(t.name)+'</div>';});if(items.length>3)str+='<div class="note">+'+(items.length-3)+' till</div>';str+='</button>';}str+='</div>'+bar(complete,total)+'<p class="caption">'+complete+' av '+total+' planerade uppgifter klara den här veckan.</p></section>';return str;}
function monthHtml(){var first=new Date(selected.getFullYear(),selected.getMonth(),1,12),offset=weekday(first),lastDay=new Date(selected.getFullYear(),selected.getMonth()+1,0).getDate(),all=0,finished=0,str='<section class="panel"><div class="panelhead"><h3>'+MONTH_NAMES[selected.getMonth()].charAt(0).toUpperCase()+MONTH_NAMES[selected.getMonth()].slice(1)+'</h3><span class="pill">Tryck på ett datum</span></div><div class="monthgrid">';for(var w=0;w<7;w++)str+='<div class="monthweekday">'+DAY_NAMES[w].slice(0,3)+'</div>';for(var z=0;z<offset;z++)str+='<div class="monthday empty"></div>';for(var i=1;i<=lastDay;i++){var d=new Date(first.getFullYear(),first.getMonth(),i,12),n=due(d).length,c=countDone(d);all+=n;finished+=c;str+='<button class="monthday '+(sameDay(d,new Date())?'today':'')+'" data-action="open-date" data-date="'+fmt(d)+'"><div class="monthnum">'+i+'</div><div class="monthstat">'+(n?('<span class="dot '+(n>c?'miss':'')+'"></span>'+c+' / '+n+' klara'):'Ledigt')+'</div></button>';}str+='</div>'+bar(finished,all)+'<p class="caption">'+finished+' av '+all+' planerade uppgifter avklarade under månaden.</p></section>';return str;}
function shoppingHtml(){var toBuy=state.shopping.filter(function(x){return !x.done;}).length;var s='<div class="statgrid"><div class="stat"><label>KVAR ATT KÖPA</label><strong>'+toBuy+'</strong><span>varor</span></div><div class="stat"><label>I LISTAN</label><strong>'+state.shopping.length+'</strong><span>varor totalt</span></div><div class="stat"><label>KLARA</label><strong>'+(state.shopping.length-toBuy)+'</strong><span>avbockade</span></div></div><section class="panel"><div class="panelhead"><h3>Handla</h3><button class="minibtn" data-action="clear-shopping">Rensa köpta</button></div><form id="shoppingForm" class="listcontrols"><input class="textinput" id="shoppingName" type="text" required maxlength="100" placeholder="Lägg till exempelvis mjölk" aria-label="Ny vara"><button class="primary" type="submit">Lägg till</button></form>';
state.shopping.slice().sort(function(a,b){return Number(a.done)-Number(b.done);}).forEach(function(t){s+='<div class="taskrow"><button class="check '+(t.done?'done':'')+'" data-action="toggle-shopping" data-id="'+esc(t.id)+'" aria-label="Markera '+esc(t.name)+'">'+(t.done?'✓':'')+'</button><div><div class="taskname '+(t.done?'done':'')+'">'+esc(t.name)+'</div></div><div class="taskend"><button class="minibtn danger" data-action="delete-shopping" data-id="'+esc(t.id)+'">Ta bort</button></div></div>';});if(!state.shopping.length)s+='<div class="empty">Listan är tom. Lägg till din första vara.</div>';s+='</section><div class="helper">Inköpslistan lagras bara på denna iPad. Den synkas inte med mobilen i första versionen.</div>';return s;}
function tasksHtml(){var str='<section class="panel"><div class="panelhead"><h3>Städuppgifter</h3><button class="primary" data-action="add-task">+ Ny uppgift</button></div><p class="caption">Välj vilka dagar varje uppgift ska återkomma. Du kan ändra alla exempeluppgifter.</p>';state.tasks.forEach(function(t){str+='<div class="manageitem"><div class="maintext"><div class="taskname">'+esc(t.name)+'</div><div class="taskmeta">'+esc(t.room)+' · '+esc(scheduleLabel(t))+'</div></div><button class="minibtn" data-action="edit-task" data-id="'+esc(t.id)+'">Ändra</button><button class="minibtn danger" data-action="delete-task" data-id="'+esc(t.id)+'">Ta bort</button></div>';});if(!state.tasks.length)str+='<div class="empty">Inga uppgifter ännu. Lägg till din första uppgift.</div>';str+='</section><div class="helper">Städrutinen är ett förslag, inte en regel. Anpassa efter ditt hem och dina behov.</div>';return str;}
function settingsHtml(){return '<section class="panel"><div class="panelhead"><h3>Utseende</h3><span class="pill">Egen inställning</span></div><p class="caption">Välj mörkt läge eller automatisk växling. Om ingen knapp är vald används ljust läge.</p><div class="themecontrols" role="group" aria-label="Välj skärmens färgtema"><button id="themeAuto" class="themechoice" type="button" data-action="theme-auto" aria-pressed="false">◐ Automatiskt</button><button id="themeDark" class="themechoice" type="button" data-action="theme-dark" aria-pressed="false">☾ Mörkt läge</button></div><p class="themehint" id="themeStatus" aria-live="polite"></p><p class="caption">Automatiskt använder iPadens klocka. Mörkt läge gäller kl. 19.00–07.00.</p></section><section class="panel"><h3>Skärmen</h3><p class="caption">Knappen försöker hålla skärmen tänd medan tavlan visas.</p><button class="wake" id="wakeButton" type="button" data-action="wake" aria-pressed="false">☼ Håll skärmen tänd</button><p class="sidehint" id="wakeHint" aria-live="polite">Avstängd. Funktionen måste testas på din iPad.</p><p class="caption">Alternativ: Inställningar → Visning och ljusstyrka → Autolås → Aldrig, om valet finns.</p><p class="caption">Sänk ljusstyrkan och kontrollera att iPaden inte blir varm under laddning.</p></section><section class="panel"><div class="panelhead"><h3>Säkerhetskopia</h3><span class="pill">Viktigt</span></div><p class="caption">Safari kan radera webbplatsdata. Spara en kopia regelbundet, exempelvis i Anteckningar eller som en textfil.</p><div class="fieldblock"><label class="field" for="backupText">Din säkerhetskopia (JSON)</label><textarea id="backupText" spellcheck="false" placeholder="Tryck på Visa kopia för att få en säkerhetskopia. Klistra in en gammal kopia här för att återställa."></textarea></div><button class="secondary" data-action="backup">Visa och markera kopia</button> <button class="primary" data-action="restore">Återställ inklistrad kopia</button></section><section class="panel"><h3>Om tavlan</h3><p class="caption">Version 1.2 · En HTML-fil med inbyggd CSS och JavaScript. Ingen inloggning, ingen extern tjänst och ingen automatisk synkronisering.</p><p class="caption">Datum och tid kommer från iPadens systemklocka. Kontrollera att klockan stämmer.</p></section>';}
function openTask(id,dayDate){editing=id||null;var t=null;var chosen=dayDate||new Date();if(id)for(var i=0;i<state.tasks.length;i++)if(state.tasks[i].id===id)t=state.tasks[i];$('modalTitle').textContent=t?'Ändra uppgift':'Ny uppgift';$('taskName').value=t?t.name:'';$('taskRoom').value=t?t.room:'Hela hemmet';$('taskFrequency').value=t?t.type:(dayDate?'once':'weekly');$('taskInterval').value=t?t.eachN:14;$('taskStart').value=t?t.start:fmt(chosen);$('taskOnceDate').value=t&&t.type==='once'?t.start:fmt(chosen);$('taskMonthDay').value=t?t.monthDay:chosen.getDate();var ds=$('dayChoices');ds.innerHTML='';for(var j=0;j<7;j++)ds.innerHTML+='<label><input type="checkbox" class="weekdayCheck" value="'+j+'" '+((t&&t.days.indexOf(j)>=0)||(!t&&j===(dayDate?weekday(chosen):5))?'checked':'')+'>'+DAY_NAMES[j].slice(0,3)+'</label>';frequencyFields();$('taskModal').className='modalshade visible';$('taskName').focus();}
function frequencyFields(){var v=$('taskFrequency').value;$('onceFields').style.display=v==='once'?'block':'none';$('taskOnceDate').required=v==='once';$('weeklyFields').style.display=v==='weekly'?'block':'none';$('intervalFields').style.display=v==='interval'?'grid':'none';$('monthlyFields').style.display=v==='monthly'?'block':'none';}
function closeTask(){$('taskModal').className='modalshade';editing=null;}
function submitTask(e){e.preventDefault();var name=$('taskName').value.trim(),type=$('taskFrequency').value;if(!name)return;var days=Array.prototype.map.call(document.querySelectorAll('.weekdayCheck:checked'),function(c){return Number(c.value);});if(type==='weekly'&&!days.length){alert('Välj minst en veckodag.');return;}var eachN=parseInt($('taskInterval').value,10),monthDay=parseInt($('taskMonthDay').value,10);if(type==='interval'&&(!(eachN>=1&&eachN<=365)||!/^\d{4}-\d\d-\d\d$/.test($('taskStart').value))){alert('Ange antal dagar och första datum.');return;}if(type==='monthly'&&!(monthDay>=1&&monthDay<=31)){alert('Välj en dag mellan 1 och 31.');return;}if(type==='once'&&!/^\d{4}-\d\d-\d\d$/.test($('taskOnceDate').value)){alert('Välj ett datum.');return;}var obj={id:editing||uid(),name:name,room:$('taskRoom').value,type:type,days:days,eachN:eachN||14,start:type==='once'?$('taskOnceDate').value:($('taskStart').value||fmt(new Date())),monthDay:monthDay||1};var replaced=false;state.tasks=state.tasks.map(function(t){if(t.id===editing){replaced=true;return obj;}return t;});if(!replaced)state.tasks.push(obj);save();closeTask();render();}
function navigate(v){page=v;render();}
function changeDate(step){if(page==='day')selected=advance(selected,step);if(page==='week')selected=advance(selected,step*7);if(page==='month')selected=new Date(selected.getFullYear(),selected.getMonth()+step,1,12);render();}
function currentTheme(){var hour=(new Date()).getHours();return state.theme==='dark'||(state.theme==='auto'&&(hour>=19||hour<7))?'dark':'light';}
function applyTheme(){if(!state)return;var active=currentTheme()==='dark';var html=document.documentElement;html.className=active?'theme-dark':'';var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',active?'#121a17':'#f4f4ef');var a=$('themeAuto'),d=$('themeDark'),status=$('themeStatus');if(a)a.setAttribute('aria-pressed',state.theme==='auto'?'true':'false');if(d)d.setAttribute('aria-pressed',state.theme==='dark'?'true':'false');if(status){var mode=state.theme==='auto'?'Automatiskt':state.theme==='dark'?'Mörkt':'Ljust';status.textContent='Valt: '+mode+'. Just nu: '+(active?'mörkt':'ljust')+' läge.';}}
function setTheme(mode){state.theme=state.theme===mode?'light':mode;save();applyTheme();}
function updateClock(){var d=new Date();$('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);applyTheme();}
function updateWakeControls(){var b=$('wakeButton'),hint=$('wakeHint');if(b){b.textContent=keepAwake?'☀ Skärmen hålls tänd (test)':'☼ Håll skärmen tänd';b.className=keepAwake?'wake on':'wake';b.setAttribute('aria-pressed',keepAwake?'true':'false');}if(hint)hint.textContent=keepAwake?'Försöker hålla skärmen tänd. Testa med autolås.':'Avstängd. Funktionen måste testas på din iPad.';}
function toggleWake(){var video=$('wakeVideo');if(keepAwake){keepAwake=false;video.pause();if(awakeNative){try{awakeNative.release();}catch(e){}awakeNative=null;}updateWakeControls();return;}
if(navigator.wakeLock&&navigator.wakeLock.request){try{navigator.wakeLock.request('screen').then(function(lock){awakeNative=lock;keepAwake=true;updateWakeControls();}).catch(function(){playLegacy(video);});}catch(e){playLegacy(video);}}else playLegacy(video);}
function playLegacy(video){try{video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.loop=true;var p=video.play();if(p&&typeof p.then==='function'){p.then(function(){keepAwake=true;updateWakeControls();}).catch(function(){updateWakeControls();alert('Safari kunde inte starta videon. Prova Autolås → Aldrig under iPadens inställningar.');});}else{keepAwake=!video.paused;updateWakeControls();if(!keepAwake)alert('Safari kunde inte starta videon. Prova Autolås → Aldrig.');}}catch(e){updateWakeControls();alert('Videometoden fungerar inte här.');}}
function handleAction(btn){var a=btn.getAttribute('data-action'),id=btn.getAttribute('data-id');if(a==='toggle'){for(var i=0;i<state.tasks.length;i++)if(state.tasks[i].id===id){mark(state.tasks[i].id,parseDate(btn.getAttribute('data-date')));break;}}
else if(a==='open-date'){selected=parseDate(btn.getAttribute('data-date'));page='day';render();}
else if(a==='wake')toggleWake();else if(a==='theme-auto')setTheme('auto');else if(a==='theme-dark')setTheme('dark');
else if(a==='add-day-task')openTask(null,selected);else if(a==='add-task')openTask();else if(a==='edit-task')openTask(id);
else if(a==='delete-task'){if(confirm('Ta bort uppgiften och dess historik?')){state.tasks=state.tasks.filter(function(t){return t.id!==id;});Object.keys(state.done).forEach(function(k){state.done[k]=state.done[k].filter(function(x){return x!==id;});if(!state.done[k].length)delete state.done[k];});save();render();}}
else if(a==='toggle-shopping'){state.shopping.forEach(function(x){if(x.id===id)x.done=!x.done;});save();render();}
else if(a==='delete-shopping'){state.shopping=state.shopping.filter(function(x){return x.id!==id;});save();render();}
else if(a==='clear-shopping'){state.shopping=state.shopping.filter(function(x){return !x.done;});save();render();}
else if(a==='backup'){var el=$('backupText');el.value=JSON.stringify(state,null,2);el.focus();el.select();}
else if(a==='restore'){try{var text=$('backupText').value;var obj=JSON.parse(text);if(!obj||!Array.isArray(obj.tasks)||!Array.isArray(obj.shopping)||!obj.done||typeof obj.done!=='object')throw new Error('Ogiltig kopia');if(!confirm('Ersätta alla befintliga uppgifter, inköp och historik?'))return;state=obj;if(['light','dark','auto'].indexOf(state.theme)<0)state.theme='light';save();render();alert('Säkerhetskopian har återställts.');}catch(e){alert('Kopian kunde inte läsas. Kontrollera att hela texten är inklistrad.');}}
}
$('navigation').addEventListener('click',function(e){var target=e.target;while(target&&target!==this&&!target.getAttribute('data-nav'))target=target.parentNode;if(target&&target.getAttribute('data-nav'))navigate(target.getAttribute('data-nav'));});
$('content').addEventListener('click',function(e){var target=e.target;while(target&&target!==this&&!target.getAttribute('data-action'))target=target.parentNode;if(target&&target.getAttribute('data-action'))handleAction(target);});
$('content').addEventListener('submit',function(e){if(e.target.id==='shoppingForm'){e.preventDefault();var input=$('shoppingName'),v=input.value.trim();if(!v)return;state.shopping.push({id:uid(),name:v,done:false});save();render();}});
$('taskForm').addEventListener('submit',submitTask);$('taskFrequency').addEventListener('change',frequencyFields);$('cancelTask').addEventListener('click',closeTask);$('taskModal').addEventListener('click',function(e){if(e.target===this)closeTask();});$('prevDate').addEventListener('click',function(){changeDate(-1);});$('nextDate').addEventListener('click',function(){changeDate(1);});$('goToday').addEventListener('click',function(){selected=midnight(new Date());render();});
var lastToday=fmt(new Date());setInterval(function(){updateClock();var now=fmt(new Date());if(now!==lastToday){if(page==='day'&&fmt(selected)===lastToday)selected=midnight(new Date());lastToday=now;render();}},30000);
state=load();save();render();
})();
</script>
