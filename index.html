<script>
(function(){
'use strict';
var KEY='hemma-stadtavla-v1', DAYS=['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'],MONTHS=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];

function load(){try{var raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw))}catch(e){storageError=true}return defaults()}

function schedule(t){return {type:t.type,days:t.days||[],eachN:t.eachN||1,start:t.start,monthDay:t.monthDay}}
function scheduled(s,d){if(!s)return false;if(s.start&&dateNum(d)<dateNum(parseDate(s.start)))return false;var w=weekday(d);if(s.type==='once')return fmt(d)===s.start;if(s.type==='daily')return true;if(s.type==='weekly')return Array.isArray(s.days)&&s.days.indexOf(w)>=0;if(s.type==='interval'){var n=Math.max(1,parseInt(s.eachN,10)||1);return (dateNum(d)-dateNum(parseDate(s.start)))%n===0}if(s.type==='monthly')return d.getDate()===Math.min(Math.max(1,+s.monthDay||1),new Date(d.getFullYear(),d.getMonth()+1,0).getDate());return false}
function entity(t,sub){return sub?sub.id:t.id}

function snapshotUndo(){lastUndo=deep(state)}

function bar(c,n){return '<div class="progress"><div style="width:'+(n?Math.round(100*c/n):100)+'%"></div></div>'}
function menu(id,date,sub){return '<div class="menuwrap"><button class="morebtn" data-action="menu" data-id="'+esc(id)+'" data-date="'+esc(date||'')+'" data-sub="'+(sub?'1':'0')+'" aria-label="Fler alternativ" aria-expanded="'+(openMenu===id+'|'+(date||'')?'true':'false')+'">⋯</button>'+(openMenu===id+'|'+(date||'')?'<div class="dropdown"><button data-action="edit-entity" data-id="'+esc(id)+'">Redigera</button><button data-action="move" data-id="'+esc(id)+'" data-date="'+esc(date||fmt(selected))+'">Flytta</button><button class="danger" data-action="delete-entity" data-id="'+esc(id)+'">Ta bort</button></div>':'')+'</div>'}
function row(e,d){var yes=completed(e.id,d),name=e.sub?e.sub.name:e.t.name,notes=e.sub?e.sub.notes:e.t.notes;return '<div class="taskrow"><button class="taskhit" data-action="toggle" data-id="'+esc(e.id)+'" data-date="'+fmt(d)+'" aria-pressed="'+yes+'"><span class="checkmark '+(yes?'done':'')+'">✓</span><span class="tasktext"><span class="taskname '+(yes?'done':'')+'">'+esc(name)+'</span>'+(notes?'<span class="note-inline">'+esc(notes)+'</span>':'')+'</span></button>'+menu(e.id,fmt(d),!!e.sub)+'</div>'}
function groupRows(d,entries){var out='',groups=[];entries.forEach(function(e){var key=e.t.id,g=groups.find(function(x){return x.t.id===key});if(!g){g={t:e.t,items:[]};groups.push(g)}g.items.push(e)});groups.forEach(function(g){if(!g.t.subs.length){out+=row(g.items[0],d);return}var all=dueEntries(d).filter(function(x){return x.t.id===g.t.id});var finished=all.filter(function(x){return completed(x.id,d)}).length,complete=all.length&&finished===all.length,expanded=state.settings.expanded[g.t.id]!==false;out+='<div class="taskgroup"><div class="taskrow"><button class="taskhit" data-action="expand" data-id="'+esc(g.t.id)+'" aria-expanded="'+expanded+'"><span class="chev">'+(expanded?'⌄':'›')+'</span><span class="checkmark '+(complete?'done':'')+'">✓</span><span class="tasktext"><span class="taskname '+(complete?'done':'')+'">'+esc(g.t.name)+'</span><span class="taskmeta">'+finished+' av '+all.length+' delmoment klara</span></span></button>'+menu(g.t.id,fmt(d),false)+'</div>'+(expanded?'<div class="subtasks">'+g.items.map(function(e){return row(e,d)}).join('')+'<button type="button" class="minibtn" data-action="add-sub" data-id="'+esc(g.t.id)+'">+ Delmoment</button></div>':'')+'</div>'});return out}
function filterEntries(a,d){if(filter==='remaining')return a.filter(function(e){return !completed(e.id,d)});if(filter==='done')return a.filter(function(e){return completed(e.id,d)});return a}
function filters(){return '<div class="filterbar">'+[['all','Alla'],['remaining','Kvarvarande'],['done','Färdiga']].map(function(x){return '<button class="filterbtn '+(filter===x[0]?'active':'')+'" data-action="filter" data-filter="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}
function missedEntries(){var result=[],d=today();for(var i=1;i<=7;i++){var day=advance(d,-i);dueEntries(day).forEach(function(e){if(!completed(e.id,day))result.push({e:e,d:day})})}return result}
function dayHtml(){var a=dueEntries(selected),p=progress(selected),current=dateNum(selected)===dateNum(today()),old=dateNum(selected)<dateNum(today()),header=old?'Så gick dagen':current?'Att göra idag':'Planerat den här dagen';var s='<div class="statgrid"><div class="stat"><label>UPPGIFTER</label><strong>'+p.total+'</strong><span>planerade</span></div><div class="stat"><label>AVKLARADE</label><strong>'+p.done+'</strong><span>av '+p.total+'</span></div><div class="stat"><label>KVAR</label><strong>'+(p.total-p.done)+'</strong><span>uppgifter</span></div></div>';
if(current){var misses=missedEntries();if(misses.length){s+='<section class="panel"><div class="panelhead"><h3>Missade uppgifter</h3><span class="pill warn">'+misses.length+'</span></div>';misses.forEach(function(x){s+='<div class="taskgroup"><div class="taskmeta" style="padding:8px 8px 0">'+esc(dateLong(x.d))+'</div>'+row(x.e,x.d)+'</div>'});s+='</section>'}}
s+='<section class="panel"><div class="panelhead"><h3>'+header+'</h3><div class="section-actions"><span class="pill">'+(p.total?Math.round(p.done/p.total*100):100)+'% klart</span><button type="button" class="iconbtn square-add" data-action="add-day-task" aria-label="Lägg till uppgift" title="Lägg till uppgift">+</button></div></div>'+filters();var shown=filterEntries(a,selected);if(!shown.length)s+='<div class="empty compact">'+(p.total&&p.done===p.total?'Alla dagens uppgifter är klara.':p.total?'Inga uppgifter med det här filtret.':'Inga uppgifter den här dagen.')+'</div>';else s+=groupRows(selected,shown);s+=bar(p.done,p.total);if(p.total&&p.done===p.total)s+='<p class="successnote" style="margin-top:15px;margin-bottom:0">Alla dagens uppgifter är klara.</p>';return s+'</section>'}
function weekHtml(){var start=weekStart(selected),total=0,complete=0,s='<section class="panel"><div class="panelhead"><h3>Vecka '+isoWeek(selected)+'</h3></div><div class="weekgrid">';for(var i=0;i<7;i++){var d=advance(start,i),a=dueEntries(d),p=progress(d);total+=p.total;complete+=p.done;s+='<button class="daybox '+(fmt(d)===fmt(today())?'today ':'')+'" data-action="open-date" data-date="'+fmt(d)+'"><div class="dow">'+DAYS[i]+'</div><div class="daynum">'+d.getDate()+'</div><div class="summary">'+p.done+' / '+p.total+' klara</div>';a.slice(0,3).forEach(function(e){s+='<div class="teaser '+(completed(e.id,d)?'done':'')+'">'+esc(e.sub?e.sub.name:e.t.name)+'</div>'});if(a.length>3)s+='<div class="note">+'+(a.length-3)+' till</div>';s+='</button>'}return s+'</div>'+bar(complete,total)+'<p class="caption">'+complete+' av '+total+' uppgifter klara.</p></section>'}

function shoppingHtml(){var left=state.shopping.filter(function(x){return !x.done}).length,s='<div class="statgrid"><div class="stat"><label>KVAR ATT KÖPA</label><strong>'+left+'</strong></div><div class="stat"><label>I LISTAN</label><strong>'+state.shopping.length+'</strong></div><div class="stat"><label>KLARA</label><strong>'+(state.shopping.length-left)+'</strong></div></div><section class="panel"><div class="panelhead"><h3>Handla</h3><button class="minibtn" data-action="clear-shopping">Rensa köpta</button></div><form id="shoppingForm" class="listcontrols"><input class="textinput" id="shoppingName" required maxlength="100" placeholder="Lägg till en vara" aria-label="Ny vara"><button class="primary" type="submit">Lägg till</button></form>';state.shopping.slice().sort(function(a,b){return Number(a.done)-Number(b.done)}).forEach(function(t){s+='<div class="taskrow"><button class="taskhit" data-action="toggle-shopping" data-id="'+esc(t.id)+'"><span class="checkmark '+(t.done?'done':'')+'">✓</span><span class="taskname '+(t.done?'done':'')+'">'+esc(t.name)+'</span></button><button class="morebtn danger" data-action="delete-shopping" data-id="'+esc(t.id)+'" aria-label="Ta bort vara">×</button></div>'});return s+(state.shopping.length?'':'<div class="empty">Inköpslistan är tom.</div>')+'</section>'}

function render(){var titles={day:'Dagens städning',week:'Veckoplanering',month:'Månadsöversikt',shopping:'Inköpslista',tasks:'Alla uppgifter',settings:'Inställningar'};$('pageTitle').textContent=titles[page];$('pageSub').textContent=page==='day'?dateLong(selected)+' · Vecka '+isoWeek(selected):page==='week'?'Vecka '+isoWeek(selected)+' · '+fmt(weekStart(selected))+' – '+fmt(advance(weekStart(selected),6)):page==='month'?MONTHS[selected.getMonth()]+' '+selected.getFullYear():'';var hasDate=['day','week','month'].indexOf(page)>=0;$('goToday').style.display=hasDate&&fmt(selected)!==fmt(today())?'':'none';$('prevDate').style.display=hasDate?'':'none';$('nextDate').style.display=hasDate?'':'none';Array.from(document.querySelectorAll('[data-nav]')).forEach(function(b){b.className=b.dataset.nav===page?'navbtn active':'navbtn'});$('app').classList.toggle('sidebar-hidden',state.settings.collapsed);$('content').innerHTML=page==='day'?dayHtml():page==='week'?weekHtml():page==='month'?monthHtml():page==='shopping'?shoppingHtml():page==='tasks'?tasksHtml():settingsHtml();applyTheme();updateClock();warning()}
function currentTheme(){return state.theme==='dark'||(state.theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
function applyTheme(){var dark=currentTheme()==='dark';document.documentElement.classList.toggle('theme-dark',dark);var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#121a17':'#f4f4ef'}

function fields(prefix){var type=$(prefix+'Frequency').value;if(prefix==='task'){$('onceFields').style.display=type==='once'?'block':'none';$('weeklyFields').style.display=type==='weekly'?'block':'none';$('intervalFields').style.display=type==='interval'?'grid':'none';$('monthlyFields').style.display=type==='monthly'?'block':'none';$('scheduleSummary').textContent='· '+scheduleLabel({type:type,days:readDays('taskdays'),eachN:$('taskInterval').value,start:$('taskStart').value,monthDay:$('taskMonthDay').value})}else{$('subOnceFields').style.display=type==='once'?'block':'none';$('subWeekFields').style.display=type==='weekly'?'block':'none';$('subIntervalFields').style.display=type==='interval'?'grid':'none';$('subMonthFields').style.display=type==='monthly'?'block':'none'}}
function collectSchedule(prefix){var t=$(prefix+'Frequency').value,days=readDays(prefix==='task'?'taskdays':'subdays'),n=+(prefix==='task'?$('taskInterval').value:$('subEachN').value),start=prefix==='task'?$('taskStart').value:$('subStart').value,day=+(prefix==='task'?$('taskMonthDay').value:$('subMonthDay').value),once=prefix==='task'?$('taskOnceDate').value:$('subOnceDate').value;if(t==='weekly'&&!days.length){alert('Välj minst en veckodag.');return null}if(t==='interval'&&(!n||n<1||n>365||!start)){alert('Välj antal dagar och första datum.');return null}if(t==='monthly'&&(!day||day<1||day>31)){alert('Välj en dag i månaden.');return null}if(t==='once'&&!once){alert('Välj ett datum.');return null}return {type:t,days:days,eachN:n||14,start:t==='once'?once:start||fmt(today()),monthDay:day||1}}
function openTask(id,day){var e=id?findEntity(id):null;if(e&&e.sub){openSub(e.t.id,e.sub.id);return}editing=e?e.t.id:null;var t=e?e.t:null;$('modalTitle').textContent=t?'Redigera uppgift':'Ny uppgift';$('taskName').value=t?t.name:'';$('taskRoom').value=t?t.room:'Hela hemmet';$('taskNotes').value=t?t.notes||'':'';var init=t||{type:day?'once':'weekly',days:[weekday(day||today())],eachN:14,start:fmt(day||today()),monthDay:(day||today()).getDate()};setScheduleFields('task',init);editSubs=deep(t&&t.subs?t.subs:[]);renderSubEditor();$('scheduleDetails').open=false;$('taskModal').classList.add('visible');$('taskName').focus()}

function saveTask(e){e.preventDefault();var name=$('taskName').value.trim(),s=collectSchedule('task');if(!name||!s)return;var old=editing?findEntity(editing):null;if(old){snapshotUndo();Object.assign(old.t,{name:name,room:$('taskRoom').value,notes:$('taskNotes').value.trim()},s);old.t.subs=editSubs}else{state.tasks.push(Object.assign(makeTask(name,$('taskRoom').value,s.type,s.days),s,{notes:$('taskNotes').value.trim(),subs:editSubs}))}save();closeTask();render()}

function subEditorClick(e){var b=e.target.closest('[data-subaction]');if(!b)return;var i=+b.dataset.i,a=b.dataset.subaction;if(a==='delete'){if(!confirm('Ta bort delmomentet?'))return;editSubs.splice(i,1)}else if(a==='up'||a==='down'){var other=i+(a==='up'?-1:1);if(other<0||other>=editSubs.length)return;var t=editSubs[i];editSubs[i]=editSubs[other];editSubs[other]=t}else if(a==='edit'){var newName=prompt('Delmomentets namn:',editSubs[i].name);if(newName&&newName.trim())editSubs[i].name=newName.trim();var note=prompt('Anteckning (kan lämnas tom):',editSubs[i].notes||'');if(note!==null)editSubs[i].notes=note;var inherit=confirm('Ska delmomentet följa huvuduppgiftens schema?\nOK = Ärver schema. Avbryt = Behåll befintligt eget schema.');if(inherit)editSubs[i].schedule=null}renderSubEditor()}

function openMove(id,date){var ent=findEntity(id);if(!ent)return;moveTarget=id;moveSource=date||fmt(selected);$('moveName').textContent=ent.sub?ent.sub.name:ent.t.name;$('moveDate').value=fmt(advance(parseDate(moveSource),1));$('moveModal').classList.add('visible')}

function deleteEntity(id){var e=findEntity(id);if(!e)return;if(!confirm('Ta bort '+(e.sub?'delmomentet':'uppgiften')+' och dess historik?'))return;snapshotUndo();var removed=[id];if(e.sub)e.t.subs=e.t.subs.filter(function(x){return x.id!==id});else{removed=removed.concat(e.t.subs.map(function(x){return x.id}));state.tasks=state.tasks.filter(function(x){return x.id!==id})}Object.keys(state.done).forEach(function(key){state.done[key]=state.done[key].filter(function(x){return removed.indexOf(x)<0});if(!state.done[key].length)delete state.done[key]});state.moves=state.moves.filter(function(x){return removed.indexOf(x.id)<0});state.skips=state.skips.filter(function(x){return removed.indexOf(x.id)<0});save();openMenu=null;render();toast('Uppgiften togs bort.',true)}
